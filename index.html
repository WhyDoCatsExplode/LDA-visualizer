document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

olors. The site names exactly four: background, foreground, muted, border.\n   Everything else is a locally-scoped accent (status dots, pattern gradients),\n   never a second brand palette. Base values first, semantic aliases after. */\n\n:root {\n  /* Base — light */\n  --background: #fbfbfa;\n  --foreground: #171717;\n  --muted: #71717a;\n  --border: #e4e4e7;\n\n  /* Neutral ramp the Tailwind classes in the source resolve to */\n  --neutral-50: #fafafa;\n  --neutral-100: #f5f5f5;\n  --neutral-200: #e5e5e5;\n  --neutral-400: #a3a3a3;\n  --neutral-500: #737373;\n  --neutral-700: #404040;\n  --neutral-900: #171717;\n  --neutral-950: #0a0a0a;\n\n  /* Status accents — used only as 6–8px dots beside a label */\n  --status-available: #10b981; /* emerald-500 */\n  --status-busy: #ef4444;      /* red-500 */\n\n  /* Bento pattern gradient stops (ribbonPatternTile.ts) */\n  --pattern-cyan: hsl(185 45% 55%);\n  --pattern-violet: hsl(265 40% 58%);\n  --pattern-amber: hsl(35 60% 58%);\n  --pattern-rose: hsl(350 50% 58%);\n\n  /* Semantic aliases */\n  --surface-page: var(--background);\n  --surface-solid: #ffffff;\n  --text-body: var(--foreground);\n  --text-muted: var(--muted);\n  --text-meta: rgb(23 23 23 / 0.4);   /* uppercase tracked labels */\n  --text-inverse: #ffffff;\n  --stroke-hairline: var(--border);\n  --action-solid-bg: var(--neutral-900);\n  --action-solid-fg: #ffffff;\n}\n\n:root.dark {\n  --background: #0a0a0a;\n  --foreground: #f5f5f4;\n  --muted: #a1a1aa;\n  --border: #27272a;\n\n  --surface-solid: #171717;\n  --text-meta: rgb(255 255 255 / 0.4);\n  --text-inverse: #171717;\n  --action-solid-bg: #ffffff;\n  --action-solid-fg: #171717;\n}\n<\u002Fstyle>\n  <style>/* Type scale. Two jobs only: a sans UI/body stack, and the prose ladder used\n   for rendered markdown. Headings shrink fast; the lower tiers go muted +\n   uppercase-tracked so they read as structure rather than shouting. */\n\n:root {\n  /* UI sizes */\n  --text-meta-size: 11px;    /* uppercase tracked meta labels */\n  --text-xs: 0.75rem;\n  --text-sm: 0.875rem;\n  --text-base: 1rem;\n  --text-lg: 1.125rem;\n  --text-xl: 1.25rem;\n  --text-2xl: 1.5rem;\n  --text-3xl: 1.875rem;\n  --text-5xl: 3rem;\n\n  /* Prose ladder (components.md) */\n  --prose-h1: 1.375rem;\n  --prose-h2: 1.0625rem;\n  --prose-h3: 0.9375rem;\n  --prose-h4: 0.875rem;\n  --prose-h5: 0.8125rem;\n  --prose-body: 0.9375rem;\n\n  /* Weights */\n  --weight-normal: 400; /* @kind font */\n  --weight-medium: 500; /* @kind font */\n  --weight-semibold: 600; /* @kind font */\n\n  /* Line heights */\n  --leading-tight: 1.1; /* @kind font */\n  --leading-snug: 1.3; /* @kind font */\n  --leading-normal: 1.5; /* @kind font */\n  --leading-relaxed: 1.7; /* @kind font */\n\n  /* Tracking */\n  --tracking-tight: -0.02em;\n  --tracking-normal: 0;\n  --tracking-meta: 0.1em;\n}\n<\u002Fstyle>\n  <style>/* Glass — the one material. Two nested layers: a low-opacity, heavily\n   blurred outer shell and a slightly more opaque, lightly blurred inner\n   panel. Borders are a color-mix into the surface, never a separate stroke\n   color, so it reads as one material rather than glass + a frame. */\n\n:root {\n  --glass-shell-bg: rgb(245 245 245 / 0.35);   /* neutral-100/35 */\n  --glass-shell-border: rgb(23 23 23 / 0.20);  /* neutral-900/20 */\n  --glass-shell-blur: 24px;                    /* backdrop-blur-xl */\n  --glass-shell-saturate: 1.5;                 /* @kind other */\n\n  --glass-panel-bg: rgb(255 255 255 / 0.35);   /* white/35 */\n  --glass-panel-blur: 12px;                    /* backdrop-blur-md */\n\n  /* Nav/pill glass: mostly-flat backdrop -> almost no blur, or the\n     \"see-through\" cue disappears. */\n  --glass-pill-bg: rgb(255 255 255 / 0.05);\n  --glass-pill-blur: 1px;\n\n  --scrim-bg: rgb(0 0 0 / 0.40);\n  --scrim-blur: 4px;\n}\n\n:root.dark {\n  --glass-shell-bg: rgb(10 10 10 / 0.25);      /* neutral-950/25 */\n  --glass-shell-border: rgb(255 255 255 / 0.15);\n  --glass-panel-bg: rgb(0 0 0 / 0.25);\n}\n<\u002Fstyle>\n  <style>/* Webfonts. SOURCE NOTE: the live site loads both via next/font/google\n   (Geist + Instrument Serif). No binaries shipped with the extract, so this\n   design system links the same two families from Google Fonts. Swap these\n   @import lines for local @font-face rules if you have the .woff2 files. */\n/* symbols2 */\n/* symbols2 */\n\n\n:root {\n  --font-geist-sans: \"Geist\", ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --font-geist-mono: \"Geist Mono\", ui-monospace, SFMono-Regular, Menlo, monospace;\n  --font-instrument-serif: \"Instrument Serif\", ui-serif, Georgia, serif;\n\n  /* Semantic aliases */\n  --font-body: var(--font-geist-sans);\n  --font-heading: var(--font-geist-sans);\n  --font-accent: var(--font-instrument-serif); /* italic, one word at a time */\n  --font-mono: var(--font-geist-mono);\n}\n\n/* Colors. The site names exactly four: background, foreground, muted, border.\n   Everything else is a locally-scoped accent (status dots, pattern gradients),\n   never a second brand palette. Base values first, semantic aliases after. */\n\n:root {\n  /* Base — light */\n  --background: #fbfbfa;\n  --foreground: #171717;\n  --muted: #71717a;\n  --border: #e4e4e7;\n\n  /* Neutral ramp the Tailwind classes in the source resolve to */\n  --neutral-50: #fafafa;\n  --neutral-100: #f5f5f5;\n  --neutral-200: #e5e5e5;\n  --neutral-400: #a3a3a3;\n  --neutral-500: #737373;\n  --neutral-700: #404040;\n  --neutral-900: #171717;\n  --neutral-950: #0a0a0a;\n\n  /* Status accents — used only as 6–8px dots beside a label */\n  --status-available: #10b981; /* emerald-500 */\n  --status-busy: #ef4444;      /* red-500 */\n\n  /* Bento pattern gradient stops (ribbonPatternTile.ts) */\n  --pattern-cyan: hsl(185 45% 55%);\n  --pattern-violet: hsl(265 40% 58%);\n  --pattern-amber: hsl(35 60% 58%);\n  --pattern-rose: hsl(350 50% 58%);\n\n  /* Semantic aliases */\n  --surface-page: var(--background);\n  --surface-solid: #ffffff;\n  --text-body: var(--foreground);\n  --text-muted: var(--muted);\n  --text-meta: rgb(23 23 23 / 0.4);   /* uppercase tracked labels */\n  --text-inverse: #ffffff;\n  --stroke-hairline: var(--border);\n  --action-solid-bg: var(--neutral-900);\n  --action-solid-fg: #ffffff;\n}\n\n:root.dark {\n  --background: #0a0a0a;\n  --foreground: #f5f5f4;\n  --muted: #a1a1aa;\n  --border: #27272a;\n\n  --surface-solid: #171717;\n  --text-meta: rgb(255 255 255 / 0.4);\n  --text-inverse: #171717;\n  --action-solid-bg: #ffffff;\n  --action-solid-fg: #171717;\n}\n\n/* Type scale. Two jobs only: a sans UI/body stack, and the prose ladder used\n   for rendered markdown. Headings shrink fast; the lower tiers go muted +\n   uppercase-tracked so they read as structure rather than shouting. */\n\n:root {\n  /* UI sizes */\n  --text-meta-size: 11px;    /* uppercase tracked meta labels */\n  --text-xs: 0.75rem;\n  --text-sm: 0.875rem;\n  --text-base: 1rem;\n  --text-lg: 1.125rem;\n  --text-xl: 1.25rem;\n  --text-2xl: 1.5rem;\n  --text-3xl: 1.875rem;\n  --text-5xl: 3rem;\n\n  /* Prose ladder (components.md) */\n  --prose-h1: 1.375rem;\n  --prose-h2: 1.0625rem;\n  --prose-h3: 0.9375rem;\n  --prose-h4: 0.875rem;\n  --prose-h5: 0.8125rem;\n  --prose-body: 0.9375rem;\n\n  /* Weights */\n  --weight-normal: 400; /* @kind font */\n  --weight-medium: 500; /* @kind font */\n  --weight-semibold: 600; /* @kind font */\n\n  /* Line heights */\n  --leading-tight: 1.1; /* @kind font */\n  --leading-snug: 1.3; /* @kind font */\n  --leading-normal: 1.5; /* @kind font */\n  --leading-relaxed: 1.7; /* @kind font */\n\n  /* Tracking */\n  --tracking-tight: -0.02em;\n  --tracking-normal: 0;\n  --tracking-meta: 0.1em;\n}\n\n/* Spacing — the Tailwind 0.25rem step the source is written against, plus the\n   handful of half-steps it actually reaches for (px-4.5, p-0.5). */\n\n:root {\n  --space-0-5: 0.125rem;\n  --space-1: 0.25rem;\n  --space-2: 0.5rem;\n  --space-2-5: 0.625rem;\n  --space-3: 0.75rem;\n  --space-4: 1rem;\n  --space-4-5: 1.125rem;\n  --space-5: 1.25rem;\n  --space-6: 1.5rem;\n  --space-8: 2rem;\n  --space-12: 3rem;\n  --space-16: 4rem;\n  --space-24: 6rem;\n\n  /* Recurring composites */\n  --glass-outer-pad: var(--space-3); /* p-3 on the frosted shell */\n  --glass-inner-pad: var(--space-5); /* p-5 on the inner panel */\n  --page-gutter: var(--space-6);\n  --page-max: 48rem;\n}\n\n/* Radius — three steps, mapped to the Tailwind classes the source uses. */\n\n:root {\n  --radius-sm: 0.75rem;  /* xl  — inputs, small buttons, pills */\n  --radius-md: 1rem;     /* 2xl — inner glass panel, list rows */\n  --radius-lg: 1.5rem;   /* 3xl — outer card/modal shell */\n  --radius-full: 9999px;\n\n  /* Semantic */\n  --radius-input: var(--radius-sm);\n  --radius-panel: var(--radius-md);\n  --radius-shell: var(--radius-lg);\n  --radius-pill: var(--radius-full);\n}\n\n/* Elevation — all rgba(0,0,0,…); deliberately NOT overridden in dark mode\n   (the glass surfaces carry the contrast themselves). */\n\n:root {\n  --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.06);  /* pill buttons */\n  --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.10);  /* nav bar, panel */\n  --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.18); /* modal / expanded card */\n\n  --elevation-pill: var(--shadow-sm);\n  --elevation-nav: var(--shadow-md);\n  --elevation-modal: var(--shadow-lg);\n}\n\n/* Glass — the one material. Two nested layers: a low-opacity, heavily\n   blurred outer shell and a slightly more opaque, lightly blurred inner\n   panel. Borders are a color-mix into the surface, never a separate stroke\n   color, so it reads as one material rather than glass + a frame. */\n\n:root {\n  --glass-shell-bg: rgb(245 245 245 / 0.35);   /* neutral-100/35 */\n  --glass-shell-border: rgb(23 23 23 / 0.20);  /* neutral-900/20 */\n  --glass-shell-blur: 24px;                    /* backdrop-blur-xl */\n  --glass-shell-saturate: 1.5;                 /* @kind other */\n\n  --glass-panel-bg: rgb(255 255 255 / 0.35);   /* white/35 */\n  --glass-panel-blur: 12px;                    /* backdrop-blur-md */\n\n  /* Nav/pill glass: mostly-flat backdrop -> almost no blur, or the\n     \"see-through\" cue disappears. */\n  --glass-pill-bg: rgb(255 255 255 / 0.05);\n  --glass-pill-blur: 1px;\n\n  --scrim-bg: rgb(0 0 0 / 0.40);\n  --scrim-blur: 4px;\n}\n\n:root.dark {\n  --glass-shell-bg: rgb(10 10 10 / 0.25);      /* neutral-950/25 */\n  --glass-shell-border: rgb(255 255 255 / 0.15);\n  --glass-panel-bg: rgb(0 0 0 / 0.25);\n}\n\n/* Motion. Entrances are long and soft; state changes are short. Nothing\n   bounces or overshoots — the easing curves all decelerate hard and settle. */\n\n:root {\n  --ease-entrance: cubic-bezier(0.2, 0.7, 0.2, 1); /* @kind other */\n  --ease-deblur: cubic-bezier(0, 0.85, 0.15, 1);   /* @kind other */\n  --ease-reveal: cubic-bezier(0.2, 0, 0, 1);       /* @kind other */\n  --ease-out: ease-out; /* @kind other */\n\n  --duration-fast: 0.2s;      /* @kind other */\n  --duration-modal: 0.25s;    /* @kind other */\n  --duration-glow: 0.7s;      /* @kind other */\n  --duration-entrance: 0.9s;  /* @kind other */\n  --duration-reveal: 1s;      /* @kind other */\n\n  --hover-opacity: 0.9;       /* @kind other */\n  --logo-rest-opacity: 0.35;  /* @kind other */\n  --logo-hover-opacity: 0.7;  /* @kind other */\n}\n\n/* mikaeel.ca design system — animation patterns\n   Two things worth reusing here: the \"rise + de-blur\" scroll-entrance for\n   grid/card layouts, and the paused/entered-instantly split that stops it\n   from replaying on every client-side page transition. See the note at the\n   bottom for the theme-toggle circular reveal too. */\n\n/* ---------------------------------------------------------------------\n   Card entrance: rise + settle + de-blur, staggered left/right by column,\n   with a per-card CSS var (--seed, 0..1, set inline per card) driving\n   drift/rotation so cards feel scattered rather than uniform.\n   Starts PAUSED (held at the 0% frame) until JS adds `.entering` when the\n   card scrolls into view (IntersectionObserver) — see the JS pattern below.\n   --------------------------------------------------------------------- */\n\n@keyframes card-rise-mid {\n  0% {\n    opacity: 0;\n    transform: translateY(110px) scale(1.13);\n  }\n  to {\n    opacity: 1;\n    transform: none;\n  }\n}\n\n@keyframes card-rise-left {\n  0% {\n    opacity: 0;\n    transform: translate(\n        calc(-40px - var(--seed, 0.5) * 36px),\n        calc(110px + var(--seed, 0.5) * 32px)\n      )\n      scale(1.14) rotate(calc(-2.2deg - var(--seed, 0.5) * 1.4deg));\n  }\n  to {\n    opacity: 1;\n    transform: none;\n  }\n}\n\n@keyframes card-rise-right {\n  0% {\n    opacity: 0;\n    transform: translate(\n        calc(40px + var(--seed, 0.5) * 36px),\n        calc(110px + var(--seed, 0.5) * 32px)\n      )\n      scale(1.14) rotate(calc(2.2deg + var(--seed, 0.5) * 1.4deg));\n  }\n  to {\n    opacity: 1;\n    transform: none;\n  }\n}\n\n@keyframes card-blur-decay {\n  0% {\n    filter: blur(10px);\n  }\n  to {\n    filter: blur(0);\n  }\n}\n\n.entrance-card {\n  animation: card-rise-mid 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both paused;\n}\n.entrance-card[data-col=\"left\"] {\n  animation-name: card-rise-left;\n}\n.entrance-card[data-col=\"right\"] {\n  animation-name: card-rise-right;\n}\n\n/* Run the blur half on an inner, already-clipped/rounded wrapper — not on\n   the outer card itself. `filter: blur()` on an outer unrounded element\n   renders the blur across its plain rectangular bounds, so it visibly\n   bleeds outside the card's rounded corners for the animation's duration\n   (a stark pale smear in light mode, easy to miss but present in dark).\n   Scoping the filter to an element that's already `overflow-hidden` with\n   the final border-radius keeps the blur inside the rounded shape the\n   whole time. */\n.entrance-card-inner {\n  animation: card-blur-decay 0.9s cubic-bezier(0, 0.85, 0.15, 1) both paused;\n}\n\n.entrance-card.entering,\n.entrance-card.entering .entrance-card-inner {\n  animation-play-state: running;\n}\n\n/* IMPORTANT — this is NOT interchangeable with `.entering` above.\n   `.entering` only flips animation-play-state from paused to running, so a\n   card that's already been seen this session but remounts (e.g. a\n   client-side page transition back to a page with this grid) would still\n   PLAY THE FULL 0.9s animation from its 0% frame (opacity:0, blur(10px),\n   translateY(110px)) the moment `.entering` gets reapplied — resuming a\n   paused animation is not the same as skipping it.\n   `animation: none` removes the animation (and its 0%-frame styles)\n   entirely, so the element renders directly in the settled end state with\n   nothing left to play. Apply this class instead of `.entering` when JS\n   already knows the entrance has played once this session (see the JS\n   pattern below) — never both. */\n.entrance-card.entered-instantly,\n.entrance-card.entered-instantly .entrance-card-inner {\n  animation: none;\n}\n\n/* ---------------------------------------------------------------------\n   JS pairing (React) — module-level flag, not component state/useRef.\n   A page's grid component unmounts and remounts on every client-side page\n   transition (Home -> Blog -> Home, etc). Component state and refs reset\n   on that remount just like everything else, which is the bug this avoids:\n   without it, the scroll-triggered rise-in replays every single time the\n   page is revisited, not just the first time this tab ever saw it.\n   A variable declared at module scope (outside the component function,\n   evaluated once when the JS module loads) is shared by every instance of\n   the component for as long as that JS stays loaded in the tab — i.e.\n   exactly \"this session\". A hard reload or new tab genuinely re-loads the\n   module, correctly resetting it, since that IS a fresh visit worth\n   animating again.\n\n   let hasAnimatedThisSession = false; // outside the component\n\n   useEffect(() => {\n     if (hasAnimatedThisSession) {\n       for (const card of cardsRef.current) card?.classList.add(\"entered-instantly\");\n       return; // skip the IntersectionObserver entirely\n     }\n     const observer = new IntersectionObserver((entries) => {\n       for (const entry of entries) {\n         if (entry.isIntersecting) {\n           entry.target.classList.add(\"entering\");\n           observer.unobserve(entry.target);\n           hasAnimatedThisSession = true;\n         }\n       }\n     }, { rootMargin: \"0px 0px -60px 0px\" });\n     for (const card of cardsRef.current) if (card) observer.observe(card);\n     return () => observer.disconnect();\n   }, []);\n   --------------------------------------------------------------------- */\n\n/* ---------------------------------------------------------------------\n   Theme toggle — circular reveal from the clicked swatch, driven by the\n   View Transitions API + a plain declarative CSS @keyframes (not the Web\n   Animations API targeting the pseudo-element directly — that combination\n   was inconsistent across Chrome versions in testing: wrong reveal origin,\n   stalling partway through. A declarative CSS animation on the\n   ::view-transition-new(root) pseudo-element is the API's own baseline\n   styling mechanism, which every VT-capable browser has to support\n   correctly.\n   --vt-x/--vt-y/--vt-r are set on <html> (inline style) right before\n   calling document.startViewTransition(), from the click coordinates of\n   the toggle that was pressed. --------------------------------------- */\n\n::view-transition-old(root),\n::view-transition-new(root),\n::view-transition-group(root) {\n  animation: none;\n  mix-blend-mode: normal;\n}\n\n@keyframes theme-reveal {\n  from {\n    clip-path: circle(0px at var(--vt-x, 50%) var(--vt-y, 50%));\n  }\n  to {\n    clip-path: circle(var(--vt-r, 150%) at var(--vt-x, 50%) var(--vt-y, 50%));\n  }\n}\n\n.view-transition-active::view-transition-new(root) {\n  animation: theme-reveal 1s cubic-bezier(0.2, 0, 0, 1) both;\n}\n\n/* Any element that should stay visually fixed in place during the reveal\n   (a fixed nav bar, etc) instead of being swept up into the root snapshot's\n   cross-fade needs its own `[view-transition-name: <name>]` and the same\n   animation-none treatment, scoped to that name:\n     ::view-transition-group(topnav),\n     ::view-transition-old(topnav),\n     ::view-transition-new(topnav) { animation: none; }\n*/\n\n/* mikaeel.ca design system — the WebGL \"holographic trading card\" look\n   (HolographicCard.tsx). Layout/theming tokens live here; the tilt physics\n   and the foil shader itself live in the .tsx file. Copied as-is from the\n   live site's globals.css `.holo-*` block. Import alongside tokens.css —\n   --radius-card/--card-shadow etc. below are this component's own local\n   variables (set on .holo-hover-zone), not shared with tokens.css's\n   --radius-sm|md|lg scale, so there's no naming collision either way. */\n/* Theme-level values for the card, kept on :root so they register as tokens\n   (the component reads them below via var()). */\n:root {\n  --holo-card-shadow: 0 20px 45px rgba(0, 0, 0, 0.14);\n  --holo-card-shadow-hover: 0 30px 60px rgba(0, 0, 0, 0.22);\n  --holo-glare-opacity: 0.5; /* @kind other */\n  --holo-backlight-rgb: 23, 23, 23; /* @kind color */\n}\n\n:root.dark {\n  /* Frame/text/border intentionally NOT overridden — a colored/dark frame\n     reads as a different (worse) object. Only the shadow deepens, so the\n     white card still pops against a dark page background. */\n  --holo-card-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);\n  --holo-card-shadow-hover: 0 30px 70px rgba(0, 0, 0, 0.65);\n  --holo-glare-opacity: 0.35; /* @kind other */\n  /* White backlight reads as light spilling out from behind the card once\n     the page itself is dark enough to show it against. */\n  --holo-backlight-rgb: 255, 255, 255; /* @kind color */\n}\n\n.holo-hover-zone {\n  /* Polaroid frame stays white in both themes — a colored/dark frame reads\n     as a different (worse) object entirely, not just a themed one, so this\n     is one of the few things on the card that deliberately doesn't follow\n     .dark. */\n  --frame-bg: #ffffff;\n  --card-border: rgba(0, 0, 0, 0.08);\n  --card-shadow: var(--holo-card-shadow);\n  --card-shadow-hover: var(--holo-card-shadow-hover);\n  --glare-opacity: var(--holo-glare-opacity);\n  --radius-card: 1.125rem;\n  --frame-inset: 6px;\n  display: inline-block;\n  position: relative;\n  perspective: 900px;\n}\n\n.holo-tilt {\n  width: 100%;\n  transform-style: preserve-3d;\n  transform: perspective(900px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1);\n  will-change: transform;\n}\n\n.holo-card {\n  position: relative;\n  width: 17rem;\n  max-width: 100%;\n  border-radius: var(--radius-card);\n  background: var(--frame-bg);\n  border: 1px solid var(--card-border);\n  box-shadow: var(--card-shadow);\n  padding: var(--frame-inset);\n  transition: box-shadow 0.4s ease;\n}\n\n.holo-hover-zone:hover .holo-card {\n  box-shadow: var(--card-shadow-hover);\n}\n\n/* Hover-only ambient glow behind the card (HolographicCard's `backlight`\n   prop) — not cursor-tracking like .holo-glare below (that's a reflection\n   ON the surface; this is a light source behind it). A native box-shadow\n   on .holo-card itself, not a separate blurred/absolutely-positioned div:\n   an earlier version used a sibling div with `filter: blur()`, which\n   proved unreliable twice over — a negative z-index escaped its intended\n   local stacking order into the page's own much larger one, and even\n   fixed, a small blurred div at this card's size read as invisible against\n   a textured page background no matter how far opacity/inset were pushed.\n   box-shadow sidesteps both: it's a paint property of the element's own\n   border box (nothing to mis-stack) and composites via the browser's own\n   shadow renderer rather than a filter (reads as a confident glow at a\n   modest size instead of a barely-visible blur).\n   Placed AFTER the plain :hover rule above so it wins the cascade at equal\n   selector specificity (source order is the tiebreaker) instead of being\n   silently overridden by it.\n   The glow's blur/spread radius (32px/10px) is IDENTICAL in both states\n   below — only the color's alpha changes (0 -> 0.55). Animating the\n   radius too (0 0 -> 32px 10px) made the glow visibly grow/shrink in sync\n   with the fade, which read as a sudden pop rather than a soft dissolve,\n   especially leaving. Holding the shape constant and fading only the\n   alpha is what makes it read as a gentle fade. */\n.holo-hover-zone--backlit .holo-card {\n  box-shadow:\n    var(--card-shadow),\n    0 0 32px 10px rgba(var(--holo-backlight-rgb), 0);\n  transition:\n    box-shadow 0.7s ease-out,\n    opacity 0.4s ease;\n}\n\n.holo-hover-zone--backlit:hover .holo-card {\n  box-shadow:\n    var(--card-shadow-hover),\n    0 0 32px 10px rgba(var(--holo-backlight-rgb), 0.55);\n}\n\n.holo-art {\n  position: relative;\n  border-radius: calc(var(--radius-card) - 6px);\n  overflow: hidden;\n  aspect-ratio: 272 / 392;\n  background: #111;\n}\n\n.holo-canvas {\n  display: block;\n  width: 100%;\n  height: 100%;\n}\n\n/* No WebGL: fall back to a plain photo, no foil effect. */\n.holo-tilt.no-gl .holo-canvas {\n  display: none;\n}\n\n.holo-tilt.no-gl .holo-art {\n  background-image: var(--holo-fallback-image, none);\n  background-size: cover;\n  background-position: var(--holo-fallback-position, center);\n}\n\n/* Cursor-tracking spotlight (HolographicCard's `glareIntensity` prop —\n   0 disables this layer entirely via the multiplier below). Two radial\n   layers: a small, brighter hot core right at the cursor (the actual\n   \"spotlight\") plus a wider, softer falloff underneath for the broader\n   glass-catching-light glow. Both track the pointer's own position\n   directly (--mx/--my, set from real pointer coordinates in\n   HolographicCard.tsx — not derived from the tilt angle, which reads as\n   laggy/misaligned from the actual cursor). */\n.holo-glare {\n  position: absolute;\n  inset: var(--frame-inset) var(--frame-inset) auto;\n  aspect-ratio: 272 / 392;\n  border-radius: calc(var(--radius-card) - 6px);\n  pointer-events: none;\n  opacity: 0;\n  background:\n    radial-gradient(\n      circle at var(--mx, 50%) var(--my, 50%),\n      rgba(255, 255, 255, calc(var(--glare-opacity) * 1.7 * var(--glare-intensity, 1))) 0%,\n      transparent 22%\n    ),\n    radial-gradient(\n      ellipse at var(--mx, 50%) var(--my, 50%),\n      rgba(255, 255, 255, calc(var(--glare-opacity) * var(--glare-intensity, 1))) 0%,\n      transparent 55%\n    );\n  transition: opacity 0.3s ease;\n}\n\n.holo-hover-zone:hover .holo-glare {\n  opacity: 1;\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .holo-card,\n  .holo-glare {\n    transition: none;\n  }\n}\n\n<\u002Fstyle>\n  <script src=\"39a47656-1e23-480a-a328-7949e305a9ce\"><\u002Fscript>\n  <style>\n    html, body { margin: 0; background: var(--background); color: var(--foreground); }\n    a { color: var(--foreground); } a:hover { opacity: .9; }\n    .lda-sym { text-transform: none; letter-spacing: 0; }\n    @keyframes ldaTip { from { opacity: 0; transform: translateY(4px) scale(.97); } to { opacity: 1; transform: none; } }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<sc-if value=\"{{ showRibbon }}\" hint-placeholder-val=\"{{ true }}\"><x-import component-from-global-scope=\"MikaDesignSystem_f8c809.RibbonWaveBackground\" hint-size=\"0px,0px\"><\u002Fx-import><\u002Fsc-if>\n<sc-if value=\"{{ desktopNoteOn }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeDesktopNote }}\" style=\"position: fixed; inset: 0; z-index: 55; background: var(--scrim-bg); backdrop-filter: blur(var(--scrim-blur)); -webkit-backdrop-filter: blur(var(--scrim-blur));\"><\u002Fdiv>\n  <div sc-camel-on-click=\"{{ closeDesktopNote }}\" style=\"position: fixed; inset:          <span style=\"font-size: 13px; font-weight: 500; color: var(--foreground);\">{{ c.num }}<\u002Fspan>\n              <span style=\"font-family: var(--font-mono); font-size: 11px; color: var(--foreground);\">{{ c.pct }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ showLegend }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"position: absolute; left: 24px; bottom: 22px; display: flex; flex-direction: column; gap: 10px; pointer-events: none;\">\n            <div style=\"font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-meta);\">Marginal topic distribution<\u002Fdiv>\n            <div style=\"position: relative; width: 170px; height: {{ legendH }};\">\n              <sc-for list=\"{{ legend }}\" as=\"g\" hint-placeholder-count=\"3\">\n                <div style=\"position: absolute; left: {{ g.left }}; bottom: 0; width: {{ g.d }}; height: {{ g.d }}; box-sizing: border-box; border: 1px dashed var(--muted); border-radius: 9999px;\"><\u002Fdiv>\n                <div style=\"position: absolute; left: {{ g.cx }}; right: 36px; top: {{ g.top }}; height: 1px; background: var(--border);\"><\u002Fdiv>\n                <div style=\"position: absolute; right: 0; top: {{ g.labelTop }}; font-family: var(--font-mono); font-size: 11px; color: var(--muted);\">{{ g.label }}<\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ anyClamped }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"max-width: 190px; font-size: 11px; line-height: 1.4; color: var(--muted);\">Dashed outline: under {{ minPct }}, enlarged so it stays readable<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; justify-content: space-between; align-items: flex-end; padding: 12px 4px 0;\">\n        <div style=\"font-size: 1.0625rem; font-weight: 500;\">Topics<\u002Fdiv>\n        <div style=\"font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-meta);\"><span title=\"β = p(w | z): the probability of each word given this topic. The same in every document.\">top {{ cardTerms }} words · <span class=\"lda-sym\">β<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 12px;\">\n        <sc-for list=\"{{ topics }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <div role=\"button\" tabindex=\"0\" aria-label=\"{{ t.aria }}\" sc-camel-on-click=\"{{ t.open }}\" sc-camel-on-key-down=\"{{ t.key }}\" sc-camel-on-mouse-enter=\"{{ t.enter }}\" sc-camel-on-mouse-leave=\"{{ t.leave }}\" style=\"min-width: 0; display: flex; flex-direction: column; box-sizing: border-box; opacity: {{ t.op }}; transition: opacity .2s, transform .2s cubic-bezier(0.2,0.7,0.2,1); cursor: pointer; outline: none; border-radius: 1.5rem; padding: 8px; border: 1px solid var(--glass-shell-border); background: var(--glass-shell-bg); backdrop-filter: blur(24px) saturate(1.5); box-shadow: 0 8px 24px rgb(0 0 0 / .06);\" style-hover=\"transform: translateY(-2px);\">\n            <div style=\"flex: 1; border-radius: 1rem; background: var(--glass-panel-bg); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;\">\n              <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 8px;\">\n                <span style=\"display: flex; align-items: center; gap: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-meta); white-space: nowrap;\"><span style=\"width: 7px; height: 7px; border-radius: 9999px; background: {{ t.color }};\"><\u002Fspan>{{ t.name }}<\u002Fspan>\n                <span style=\"min-width: 0; font-family: var(--font-accent); font-style: italic; font-size: 16px; color: var(--foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ t.gloss }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; flex-direction: column; gap: 2px;\">\n                <sc-for list=\"{{ t.words }}\" as=\"w\" hint-placeholder-count=\"4\">\n                  <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 15px; line-height: 1.6;\">\n                    <span style=\"min-width: 0; color: var(--foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ w.word }}<\u002Fspan>\n                    <span style=\"font-family: var(--font-mono); font-size: 13px; color: var(--muted);\">{{ w.p }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-meta);\"><span>{{ t.share }} of corpus<\u002Fspan><span>Details ›<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;playOnLoad&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;arrowStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;straight&quot;,&quot;curved&quot;],&quot;default&quot;:&quot;straight&quot;,&quot;tsType&quot;:&quot;'straight' | 'curved'&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;slow&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;'normal' | 'slow'&quot;}}\">\n// ─── Settings (mirrors LDA_Experiment_1.R) ───────────────────────────────────\nconst K_MIN = 2, K_MAX = 20, K_DEFAULT = 5;   // k_value <- 5\nconst SEED = 1;                               // control = list(seed = 1)\nconst ITERATIONS = 500;                       // Gibbs sweeps\nconst ALPHA_NUM = 50, ETA = 0.1;              // Gibbs priors: alpha = 50 / k, eta (topicmodels' delta) = 0.1\nconst CARD_TERMS = 5;                         // words per topic card\nconst TOP_TERMS = 30;                         // words in the topic detail modal\nconst MODAL_DOCS = 10;                        // documents listed in the topic detail modal\nconst LINES_PAGE = 300;                       // drill-down renders this many lines at a time\nconst WRAP = 72;                              // drill-down line width, in characters\n\n// quanteda's stopwords(\"english\") (Snowball list), plus every single letter: initials and\n// stray fragments (\"W. J. Craig\", \"don t\") otherwise surface as topic words.\nconst DEFAULT_STOPWORDS = Object.freeze([...new Set(`i me my myself we our ours ourselves you your yours yourself yourselves he him his himself\nshe her hers herself it its itself they them their theirs themselves what which who whom this that these those am is\nare was were be been being have has had having do does did doing would should could ought i'm you're he's she's it's\nwe're they're i've you've we've they've i'd you'd he'd she'd we'd they'd i'll you'll he'll she'll we'll they'll isn't\naren't wasn't weren't hasn't haven't hadn't doesn't don't didn't won't wouldn't shan't shouldn't can't cannot couldn't\nmustn't let's that's who's what's here's there's when's where's why's how's a an the and but if or because as until\nwhile of at by for with about against between into through during before after above below to from up down in out on\noff over under again further then once here there when where why how all any both each few more most other some such\nno nor not only own same so than too very will`.split(/\\s+/).concat([...'abcdefghijklmnopqrstuvwxyz']))]);\n// The active list: editable in the Stopwords modal, saved per browser and in exported pages.\nlet stopwords = new Set(DEFAULT_STOPWORDS);\nconst sameAsDefault = list => list.length === DEFAULT_STOPWORDS.length && DEFAULT_STOPWORDS.every(w => list.includes(w));\n\n// Word tokens; hyphenated and apostrophe'd words stay whole (quanteda's default).\nconst TOKEN_RE = /[\\p{L}\\p{N}]+(?:['’\\-][\\p{L}\\p{N}]+)*/gu;\nconst HAS_LETTER = /\\p{L}/u;\nconst normTok = t => t.toLowerCase().replace(/’/g, \"'\");\n\nconst PALETTE = ['hsl(185 45% 55%)', 'hsl(350 50% 58%)', 'hsl(265 40% 58%)', 'hsl(35 60% 58%)', 'hsl(145 40% 55%)',\n  'hsl(310 40% 60%)', 'hsl(220 45% 60%)', 'hsl(200 50% 55%)', 'hsl(60 45% 55%)', 'hsl(20 55% 58%)'];\nconst topicColor = i => PALETTE[i] || `hsl(${Math.round((i * 137.508) % 360)} 45% 58%)`;\n\n// ─── Preprocessing ───────────────────────────────────────────────────────────\n// Returns the model tokens (lower-cased, stopwords removed) and a word count\n// taken after punctuation/number/symbol removal but before stopwords.\nfunction preprocess(text) {\n  const s = text.replace(/\\r?\\n/g, ' ');\n  const tokens = []; let words = 0;\n  for (const m of s.matchAll(TOKEN_RE)) {\n    if (!HAS_LETTER.test(m[0])) continue;   // remove_numbers\n    words++;\n    const t = normTok(m[0]);\n    if (!stopwords.has(t)) tokens.push(t);\n  }\n  return { tokens, words };\n}\n\n// ─── LDA: collapsed Gibbs sampling ───────────────────────────────────────────\n// Priors follow topicmodels' Gibbs defaults: alpha = 50 / k, beta (delta) = 0.1.\n// Count matrices are word-major (w * K + k) so the inner loop stays in cache.\nfunction mulberry32(seed) {\n  let s = seed >>> 0;\n  return () => {\n    s = (s + 0x6D2B79F5) | 0;\n    let t = Math.imul(s ^ (s >>> 15), 1 | s);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\n\nasync function fitLDA(docs, K, { onProgress, isCancelled }) {\n  const alpha = ALPHA_NUM / K, beta = ETA, rnd = mulberry32(SEED);\n  const vocab = new Map(), terms = [];\n  const docW = docs.map(d => Int32Array.from(d.tokens, t => {\n    let id = vocab.get(t);\n    if (id === undefined) { id = terms.length; vocab.set(t, id); terms.push(t); }\n    return id;\n  }));\n  const D = docs.length, V = terms.length, Vb = V * beta;\n  if (!V) throw new Error('No words left after preprocessing');\n  const nwk = new Int32Array(V * K), nk = new Int32Array(K), ndk = new Int32Array(D * K);\n  const zs = docW.map(w => new Int32Array(w.length));\n  docW.forEach((w, d) => {\n    for (let i = 0; i < w.length; i++) {\n      const k = Math.floor(rnd() * K);\n      zs[d][i] = k; nwk[w[i] * K + k]++; nk[k]++; ndk[d * K + k]++;\n    }\n  });\n\n  const cum = new Float64Array(K), inv = new Float64Array(K);   // inv[k] = 1 / (n_k + V·beta)\n  for (let k = 0; k < K; k++) inv[k] = 1 / (nk[k] + Vb);\n  let tick = performance.now();\n  for (let it = 0; it < ITERATIONS; it++) {\n    for (let d = 0; d < D; d++) {\n      const w = docW[d], z = zs[d], o = d * K;\n      for (let i = 0; i < w.length; i++) {\n        const wo = w[i] * K; let k = z[i];\n        nwk[wo + k]--; ndk[o + k]--; inv[k] = 1 / (--nk[k] + Vb);\n        let tot = 0;\n        for (let j = 0; j < K; j++) { tot += (nwk[wo + j] + beta) * inv[j] * (ndk[o + j] + alpha); cum[j] = tot; }\n        const u = rnd() * tot;\n        k = 0; while (k < K - 1 && cum[k] < u) k++;\n        z[i] = k; nwk[wo + k]++; ndk[o + k]++; inv[k] = 1 / (++nk[k] + Vb);\n      }\n    }\n    if (performance.now() - tick > 30) {\n      if (isCancelled()) return null;\n      onProgress((it + 1) / ITERATIONS);\n      await new Promise(r => setTimeout(r));\n      tick = performance.now();\n    }\n  }\n  if (isCancelled()) return null;\n\n  // Order topics by corpus share (largest = Topic 1), like LDAvis.\n  const N = nk.reduce((a, b) => a + b, 0) || 1;\n  const order = [...Array(K).keys()].sort((a, b) => nk[b] - nk[a]);\n  const phi = new Float64Array(V * K);     // p(w | k), word-major\n  order.forEach((src, k) => { for (let w = 0; w < V; w++) phi[w * K + k] = (nwk[w * K + src] + beta) / (nk[src] + Vb); });\n  const theta = docW.map((w, d) => order.map(src => (ndk[d * K + src] + alpha) / (w.length + K * alpha)));\n  const share = order.map(src => nk[src] / N);\n  return assembleModel({ K, terms, phi, theta, share, N, lens: docW.map(w => w.length), source: 'browser' });\n}\n\n// Everything the UI needs from a fitted model: φ (word-major), θ, topic shares,\n// top words and map coordinates. Shared by in-browser fits and imported models.\nfunction assembleModel({ K, terms, phi, theta, share, N, lens, source }) {\n  const V = terms.length, vocab = new Map();\n  terms.forEach((t, w) => { const n = normTok(t); if (!vocab.has(n)) vocab.set(n, w); });\n  const topics = share.map((_, k) => {\n    const top = [];\n    for (let w = 0; w < V; w++) {\n      const p = phi[w * K + k];\n      if (top.length < TOP_TERMS || p > top[top.length - 1][1]) {\n        top.push([terms[w], p]); top.sort((a, b) => b[1] - a[1]);\n        if (top.length > TOP_TERMS) top.pop();\n      }\n    }\n    return { id: 't' + k, name: 'Topic ' + (k + 1), gloss: top[0][0], color: topicColor(k), words: top };\n  });\n  return { K, V, N, D: theta.length, terms, vocab, phi, theta, share, lens, topics, source,\n    coords: topicCoords(phi, K, V), version: Math.random() };\n}\n\n// ─── Model files (R import + embeddable export) ──────────────────────────────\n// {\n//   \"format\": \"lda-toolkit\", \"version\": 1, \"source\": \"R · topicmodels\",\n//   \"terms\":  [V words],\n//   \"phi\":    [K rows × V]   p(word | topic)      ← posterior(lda)$terms\n//   \"docs\":   [D names],\n//   \"theta\":  [D rows × K]   p(topic | doc)       ← posterior(lda)$topics\n//   \"tokens\": [D]            optional: tokens per doc after preprocessing, weights topic shares\n//   \"texts\":  [D]            optional: original texts, enables the per-word drill-down\n//   \"settings\": { \"floor\", \"showLegend\", \"title\", \"showControls\",   optional (written by\n//                 \"theme\", \"showThemeToggle\", \"showRibbon\" }         interactive-page exports)\n// }\nconst MODEL_FORMAT = 'lda-toolkit';\n\n// Export snippets shown in the import modal. The same code lives in\n// export_for_toolkit.R / export_for_toolkit.py next to this page's source.\nconst SNIPPETS = [\n  { id: 'r', label: 'R · topicmodels', file: 'export_for_toolkit.R', note: 'lda_model = your LDA() result, document_dfm = the dfm it was fit on, document_list = the raw lines per file.', code: `library(jsonlite)\n\npost <- posterior(lda_model)\nwrite_json(list(\n  format = \"lda-toolkit\", version = 1, source = \"R · topicmodels\",\n  terms  = colnames(post$terms),\n  phi    = unname(post$terms),       # K × V: p(w | z), β in the article\n  docs   = rownames(post$topics),\n  theta  = unname(post$topics),      # D × K: topic mixtures (θ)\n  tokens = unname(ntoken(document_dfm)),\n  # optional, enables the per-word document view:\n  texts  = unname(sapply(document_list, paste, collapse = \"\\\\n\"))\n), \"lda_model.json\", auto_unbox = TRUE, digits = I(6))` },\n  { id: 'sklearn', label: 'Python · scikit-learn', file: 'export_for_toolkit.py', note: 'lda = LatentDirichletAllocation, X = the document-term matrix it was fit on.', code: `import json\nimport numpy as np\n\nsig = lambda rows: [[float(f\"{v:.6g}\") for v in r] for r in rows]\n\nphi = lda.components_ / lda.components_.sum(axis=1, keepdims=True)\ntheta = lda.transform(X)\n\nwith open(\"lda_model.json\", \"w\", encoding=\"utf-8\") as f:\n    json.dump({\n        \"format\": \"lda-toolkit\", \"version\": 1, \"source\": \"Python · scikit-learn\",\n        \"terms\": vectorizer.get_feature_names_out().tolist(),\n        \"phi\": sig(phi),                  # k × V: p(word | topic)\n        \"docs\": list(names),\n        \"theta\": sig(theta),              # D × k: p(topic | doc)\n        \"tokens\": np.asarray(X.sum(axis=1)).ravel().astype(int).tolist(),\n        \"texts\": list(texts),             # optional: per-word document view\n    }, f, ensure_ascii=False)` },\n  { id: 'gensim', label: 'Python · gensim', file: 'export_for_toolkit.py', note: 'lda = LdaModel, corpus = the bag-of-words list it was trained on.', code: `import json\n\nsig = lambda rows: [[float(f\"{v:.6g}\") for v in r] for r in rows]\n\ntheta = []\nfor bow in corpus:   # dense rows: get_document_topics drops tiny topics\n    row = [0.0] * lda.num_topics\n    for k, p in lda.get_document_topics(bow, minimum_probability=0.0):\n        row[k] = float(p)\n    theta.append(row)\n\nwith open(\"lda_model.json\", \"w\", encoding=\"utf-8\") as f:\n    json.dump({\n        \"format\": \"lda-toolkit\", \"version\": 1, \"source\": \"Python · gensim\",\n        \"terms\": [lda.id2word[i] for i in range(lda.num_terms)],\n        \"phi\": sig(lda.get_topics()),     # k × V: p(word | topic)\n        \"docs\": list(names),\n        \"theta\": sig(theta),              # D × k: p(topic | doc)\n        \"tokens\": [sum(c for _, c in bow) for bow in corpus],\n        \"texts\": list(texts),             # optional: per-word document view\n    }, f, ensure_ascii=False)` },\n];\n\nfunction parseModelFile(j, extraTexts) {\n  const fail = m => { throw new Error('Model file: ' + m); };\n  if (!j || j.format !== MODEL_FORMAT) fail('not an lda-toolkit JSON (missing \"format\": \"lda-toolkit\")');\n  const { terms, phi, docs, theta } = j;\n  if (!Array.isArray(terms) || !Array.isArray(phi) || !Array.isArray(docs) || !Array.isArray(theta)) fail('needs terms, phi, docs and theta arrays');\n  const K = phi.length, V = terms.length, D = docs.length;\n  if (K < 2) fail('needs at least 2 topics');\n  if (phi.some(r => !Array.isArray(r) || r.length !== V)) fail(`every phi row must have ${V} values (one per term)`);\n  if (theta.length !== D || theta.some(r => !Array.isArray(r) || r.length !== K)) fail(`theta must be ${D} rows × ${K} topics`);\n\n  const bad = rows => rows.some(r => r.some(v => typeof v !== 'number' || !isFinite(v) || v < 0));\n  if (bad(phi)) fail('phi has negative, missing or non-numeric values');\n  if (bad(theta)) fail('theta has negative, missing or non-numeric values');\n  // Rows should each sum to 1. Unnormalised weights (e.g. scikit-learn's raw\n  // components_) are fixed by renormalising, but say so.\n  const off = rows => rows.some(r => Math.abs(r.reduce((a, b) => a + b, 0) - 1) > .01);\n  const warnings = [];\n  if (off(phi)) warnings.push('phi rows didn\\'t sum to 1');\n  if (off(theta)) warnings.push('theta rows didn\\'t sum to 1');\n\n  const texts = docs.map((name, d) => (j.texts && typeof j.texts[d] === 'string') ? j.texts[d] : extraTexts.get(name) ?? null);\n  const files = docs.map((name, d) => {\n    const text = texts[d];\n    if (text != null) return { name, text, ...preprocess(text) };\n    return { name, text: null, tokens: null, words: Array.isArray(j.tokens) ? j.tokens[d] : null };\n  });\n  const lens = docs.map((_, d) => Array.isArray(j.tokens) && j.tokens[d] > 0 ? j.tokens[d] : files[d].tokens ? files[d].tokens.length : 1);\n\n  // Renormalise rows (JSON rounding) and lay φ out word-major like in-browser fits.\n  const phiWM = new Float64Array(V * K);\n  phi.forEach((row, k) => { const s = row.reduce((a, b) => a + (+b || 0), 0) || 1; row.forEach((v, w) => phiWM[w * K + k] = (+v || 0) / s); });\n  const th = theta.map(r => { const s = r.reduce((a, b) => a + (+b || 0), 0) || 1; return r.map(v => (+v || 0) / s); });\n  const N = lens.reduce((a, b) => a + b, 0);\n  const share = Array.from({ length: K }, (_, k) => th.reduce((a, r, d) => a + r[k] * lens[d], 0) / N);\n  const model = assembleModel({ K, terms: terms.map(String), phi: phiWM, theta: th, share, N, lens, source: String(j.source || 'imported') });\n  return { files, model, settings: j.settings || {}, warnings };\n}\n\n// Drop one document from a fitted model: its θ row goes and topic shares are\n// re-weighted over the documents that remain. Topic-word distributions stay.\nfunction dropDoc(model, i) {\n  const theta = model.theta.filter((_, d) => d !== i), lens = model.lens.filter((_, d) => d !== i);\n  const N = lens.reduce((a, b) => a + b, 0) || 1;\n  const share = model.share.map((_, k) => theta.reduce((a, r, d) => a + r[k] * lens[d], 0) / N);\n  return { ...model, theta, lens, share, N, D: theta.length, version: Math.random() };\n}\n\nfunction modelToJSON(model, files, settings) {\n  const r6 = v => +v.toPrecision(6);\n  return {\n    format: MODEL_FORMAT, version: 1, source: model.source === 'browser' ? 'browser · Gibbs' : model.source,\n    terms: model.terms,\n    phi: model.topics.map((_, k) => model.terms.map((_, w) => r6(model.phi[w * model.K + k]))),\n    docs: files.map(f => f.name),\n    theta: model.theta.map(r => r.map(r6)),\n    tokens: files.map(f => f.tokens ? f.tokens.length : null),\n    texts: files.map(f => f.text),\n    settings,\n  };\n}\n\n// ─── .zip support ────────────────────────────────────────────────────────────\n// Minimal reader: walks the central directory and inflates \"stored\" or\n// \"deflate\" entries with the browser's DecompressionStream. Only text and\n// model files are extracted; macOS metadata and hidden files are skipped.\n// Zip64 and encrypted archives are rejected with a clear message.\nconst WANTED = /\\.(txt|md|csv|json)$/i;\nasync function unzip(file) {\n  const buf = new Uint8Array(await file.arrayBuffer()), dv = new DataView(buf.buffer);\n  const fail = m => { throw new Error(file.name + ': ' + m); };\n  let eocd = -1;\n  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }\n  if (eocd < 0) fail('not a valid zip file');\n  const count = dv.getUint16(eocd + 10, true);\n  let p = dv.getUint32(eocd + 16, true);\n  if (p === 0xffffffff || count === 0xffff) fail('zip64 archives aren\\'t supported; re-zip with a standard tool');\n  const entries = [], utf8 = new TextDecoder();\n  for (let n = 0; n < count; n++) {\n    if (dv.getUint32(p, true) !== 0x02014b50) fail('the archive looks corrupted');\n    const flags = dv.getUint16(p + 8, true), method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true);\n    const nameLen = dv.getUint16(p + 28, true), extraLen = dv.getUint16(p + 30, true), commentLen = dv.getUint16(p + 32, true);\n    const local = dv.getUint32(p + 42, true), path = utf8.decode(buf.subarray(p + 46, p + 46 + nameLen));\n    p += 46 + nameLen + extraLen + commentLen;\n    if (path.endsWith('/') || /(^|\\/)(__MACOSX\\/|\\.)/.test(path) || !WANTED.test(path)) continue;\n    if (flags & 1) fail('encrypted zips aren\\'t supported');\n    if (method !== 0 && method !== 8) fail(`\"${path}\" uses an unsupported compression method`);\n    const start = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true), raw = buf.subarray(start, start + size);\n    const data = method === 0 ? raw\n      : new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());\n    entries.push({ path, data });\n  }\n  // Use bare file names unless two entries in different folders share one.\n  const base = e => e.path.split('/').pop(), seen = {};\n  entries.forEach(e => seen[base(e)] = (seen[base(e)] || 0) + 1);\n  return entries.map(e => new File([e.data], seen[base(e)] > 1 ? e.path : base(e), { type: /\\.json$/i.test(e.path) ? 'application/json' : 'text/plain' }));\n}\nconst isZip = f => /\\.zip$/i.test(f.name) || /zip/.test(f.type);\n\n// Page title: *asterisks* mark the italic serif accent.\nconst DEFAULT_TITLE = '*LDA* visualizer';\nconst titleSegs = t => String(t).split(/(\\*[^*]+\\*)/).filter(Boolean).map(p => {\n  const em = /^\\*[^*]+\\*$/.test(p);\n  return { text: em ? p.slice(1, -1) : p, font: em ? 'var(--font-accent)' : 'inherit', style: em ? 'italic' : 'normal', weight: em ? 400 : 'inherit', size: em ? '1.15em' : 'inherit' };\n});\nconst plainTitle = t => String(t).replace(/\\*/g, '').trim();\nconst escapeHTML = t => t.replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' })[c]);\n\n// Exported pages carry the corpus + model gzipped and base64-encoded. As raw JSON a\n// large corpus runs past static hosts' per-file limits (Cloudflare Pages: 25 MiB).\nasync function gzipBase64(text) {\n  const gz = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));\n  const buf = new Uint8Array(await new Response(gz).arrayBuffer());\n  let bin = '';\n  for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));\n  return btoa(bin);\n}\nasync function gunzipBase64(b64) {\n  const bin = atob(b64), buf = new Uint8Array(bin.length);\n  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);\n  return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();\n}\n\nfunction download(name, content, type) {\n  const blob = content instanceof Blob ? content : new Blob([content], { type });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob); a.download = name;\n  document.body.appendChild(a); a.click(); a.remove();\n  setTimeout(() => URL.revokeObjectURL(a.href), 2000);\n}\nconst csvCell = v => { const s = String(v ?? ''); return /[\",\\n]/.test(s) ? '\"' + s.replace(/\"/g, '\"\"') + '\"' : s; };\nconst toCSV = rows => rows.map(r => r.map(csvCell).join(',')).join('\\n');\n\n// ─── Intertopic distance map (LDAvis-style) ──────────────────────────────────\n// Jensen–Shannon divergence between topic-word distributions, then classical\n// MDS (PCoA) to two dimensions.\nfunction topicCoords(phi, K, V) {\n  const js = (a, b) => {\n    let s = 0;\n    for (let w = 0; w < V; w++) {\n      const p = phi[w * K + a], q = phi[w * K + b], m = (p + q) / 2;\n      s += p * Math.log(p / m) + q * Math.log(q / m);\n    }\n    return s / 2;\n  };\n  const D2 = Array.from({ length: K }, () => new Float64Array(K));\n  for (let a = 0; a < K; a++) for (let b = a + 1; b < K; b++) { const d = js(a, b); D2[a][b] = D2[b][a] = d * d; }\n  // Double-centre: B = -1/2 J D² J\n  const row = D2.map(r => r.reduce((x, y) => x + y, 0) / K), all = row.reduce((x, y) => x + y, 0) / K;\n  const B = D2.map((r, i) => Array.from(r, (v, j) => -0.5 * (v - row[i] - row[j] + all)));\n  const { values, vectors } = jacobiEigen(B);\n  const idx = [...values.keys()].sort((a, b) => values[b] - values[a]).slice(0, 2);\n  return Array.from({ length: K }, (_, i) => idx.map(e => values[e] > 0 ? vectors[i][e] * Math.sqrt(values[e]) : 0));\n}\n\nfunction jacobiEigen(M) {\n  const n = M.length, a = M.map(r => Array.from(r));\n  const v = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => +(i === j)));\n  for (let sweep = 0; sweep < 100; sweep++) {\n    let off = 0;\n    for (let p = 0; p < n; p++) for (let q = p + 1; q < n; q++) off += a[p][q] * a[p][q];\n    if (off < 1e-20) break;\n    for (let p = 0; p < n; p++) for (let q = p + 1; q < n; q++) {\n      if (Math.abs(a[p][q]) < 1e-18) continue;\n      const th = (a[q][q] - a[p][p]) / (2 * a[p][q]);\n      const t = (th >= 0 ? 1 : -1) / (Math.abs(th) + Math.sqrt(th * th + 1));\n      const c = 1 / Math.sqrt(t * t + 1), s = t * c;\n      for (let k = 0; k < n; k++) { const kp = a[k][p], kq = a[k][q]; a[k][p] = c * kp - s * kq; a[k][q] = s * kp + c * kq; }\n      for (let k = 0; k < n; k++) { const pk = a[p][k], qk = a[q][k]; a[p][k] = c * pk - s * qk; a[q][k] = s * pk + c * qk; }\n      for (let k = 0; k < n; k++) { const kp = v[k][p], kq = v[k][q]; v[k][p] = c * kp - s * kq; v[k][q] = s * kp + c * kq; }\n    }\n  }\n  return { values: a.map((r, i) => r[i]), vectors: v };\n}\n\n// Circle area ∝ topic share: diameter = √share × MAP_SCALE px, with a floor so\n// small topics stay readable. The size legend uses the same formula.\nconst MAP_SCALE = 210, MAP_MIN_D = 30, MAP_LEGEND = [.25, .10, .04];\nconst circleD = p => Math.sqrt(p) * MAP_SCALE;\n\n// Map PCoA coordinates into the panel, keeping the axis crossing at (50%, 42%).\nfunction mapPositions(coords) {\n  const mx = Math.max(1e-9, ...coords.map(c => Math.abs(c[0]))), my = Math.max(1e-9, ...coords.map(c => Math.abs(c[1])));\n  const s = Math.min(32 / mx, 24 / my);\n  return coords.map(([x, y]) => [(50 + x * s).toFixed(2) + '%', (42 - y * s).toFixed(2) + '%']);\n}\n\n// ─── Drill-down document view ────────────────────────────────────────────────\n// Re-wraps the source text into short lines and tags every modelled token with\n// its posterior p(z | w, d) ∝ θ_dk · φ_kw. Each line gets one gutter dot showing\n// its dominant topic (argmax of the line's averaged posteriors).\n//\n// The highlight floor compares against a rescaled confidence,\n// (p − 1/k) / (1 − 1/k): 0 = no preference between topics, 1 = certain. Raw p\n// can never fall below 1/k, so an unscaled floor would be dead below that.\nconst confidence = (p, K) => Math.max(0, (p - 1 / K) / (1 - 1 / K));\nfunction wrapText(text) {\n  const raw = text.replace(/\\r\\n?/g, '\\n').split('\\n');\n  const blanks = raw.filter(l => !l.trim()).length;\n  // Hard-wrapped files separate paragraphs with blank lines; otherwise treat\n  // every line as its own paragraph.\n  const paras = blanks >= raw.length / 20\n    ? text.replace(/\\r\\n?/g, '\\n').split(/\\n\\s*\\n/).map(p => p.replace(/\\s+/g, ' ').trim())\n    : raw.map(l => l.replace(/\\s+/g, ' ').trim());\n  const lines = [];\n  paras.filter(Boolean).forEach((p, pi) => {\n    if (pi) lines.push('');\n    let cur = '';\n    for (const word of p.split(' ')) {\n      if (cur && cur.length + 1 + word.length > WRAP) { lines.push(cur); cur = word; }\n      else cur = cur ? cur + ' ' + word : word;\n    }\n    if (cur) lines.push(cur);\n  });\n  return lines;\n}\n\nfunction buildDoc(file, di, model) {\n  const K = model.K, th = model.theta[di], post = new Map();\n  const posterior = wid => {\n    let p = post.get(wid);\n    if (!p) {\n      const r = th.map((t, k) => t * model.phi[wid * K + k]), s = r.reduce((a, b) => a + b, 0);\n      const probs = r.map(x => x / s), best = probs.indexOf(Math.max(...probs));\n      p = { probs, best, p: probs[best], conf: confidence(probs[best], K) };\n      post.set(wid, p);\n    }\n    return p;\n  };\n  let idx = 0;\n  const lines = wrapText(file.text).map((text, li) => {\n    const segs = [], toks = [], mix = new Float64Array(K); let last = 0, n = 0;\n    for (const m of text.matchAll(TOKEN_RE)) {\n      const wid = model.vocab.get(normTok(m[0]));\n      if (wid === undefined) continue;\n      if (m.index > last) segs.push({ text: text.slice(last, m.index) });\n      const ps = posterior(wid), tok = { text: m[0], idx: idx++, wid, topic: ps.best, conf: ps.conf };\n      segs.push(tok); toks.push(tok); last = m.index + m[0].length;\n      ps.probs.forEach((v, k) => mix[k] += v); n++;\n    }\n    if (last < text.length || !segs.length) segs.push({ text: text.slice(last) || ' ' });\n    if (!n) return { segs, anchor: null, mix: null };\n    const lineMix = Array.from(mix, v => v / n), dom = lineMix.indexOf(Math.max(...lineMix));\n    // The arrow points at the line's first word assigned to the dominant topic.\n    const at = toks.find(t => t.topic === dom) || toks[0];\n    return { segs, mix: lineMix, anchor: { idx: at.idx, line: li, topic: dom, conf: confidence(lineMix[dom], K) } };\n  });\n  return { name: file.name, lines, post, words: file.words };\n}\n\n// ─── Component ───────────────────────────────────────────────────────────────\nclass Component extends DCLogic {\n  state = { floor: 0, k: K_DEFAULT, files: [], model: null, fitting: false, progress: 0, error: null,\n    doc: null, view: 'files', hoverFile: null, hover: null, step: 0, lineCap: LINES_PAGE, dragging: false,\n    geo: { arrows: [], w: 0, h: 0 } };\n  rootRef = React.createRef();\n  runId = 0;\n  docCache = null;\n\n  curDoc() {\n    const { model, doc, files } = this.state;\n    if (!mode
